<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03175e" />
    <meta name="description" content="Tabie — a premium Arabic-first streaming platform prototype. More than just a platform." />
    <title>Tabie</title>
    <script>
      // Stamp the saved theme before first paint — the React provider sets the same
      // attribute, but only after mount, which would flash the default surfaces.
      try {
        var t = JSON.parse(localStorage.getItem('tabie:settings') || '{}').theme;
        document.documentElement.setAttribute('data-theme', t === 'brand-navy' ? t : 'midnight');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'midnight');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
